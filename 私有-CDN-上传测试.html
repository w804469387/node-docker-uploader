<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>私有 CDN 上传测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .preview { margin-top: 20px; border: 1px solid #ddd; padding: 10px; display: inline-block; }
        img { max-width: 300px; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>CDN 图片上传演示</h2>
    
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="uploadFile()">点击上传</button>

    <div id="result"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const resultDiv = document.getElementById('result');

            if (!file) {
                alert("请先选择一张图片");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                resultDiv.innerHTML = "正在上传...";
                
                // 调用你的本地上传接口
                const response = await fetch('http://localhost:3000/upload', {
                    method: 'POST',
                    headers: {
                        // 必须与 server.js 中的 AUTH_TOKEN 一致
                        'Authorization': 'Bearer my-secret-password'
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="preview">
                            <strong>上传成功!</strong><br>
                            CDN 链接: <a href="${data.url}" target="_blank">${data.url}</a>
                            <br>
                            <img src="${data.url}" alt="Uploaded Image">
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<span style="color:red">上传失败: ${data.error}</span>`;
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = `<span style="color:red">网络错误，请检查 Docker 是否启动</span>`;
            }
        }
    </script>
</body>
</html>
